name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.exe
            *.flatpak
