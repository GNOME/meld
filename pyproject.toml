[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python == 0.20.0",
    "meson == 1.12.0",
]

[project]
name = "Meld"
dynamic = [
    "version",
]
description = "Meld is a visual diff and merge tool targeted at developers. Meld helps you\ncompare files, directories, and version controlled projects. It provides\ntwo- and three-way comparison of both files and directories, and supports\nmany version control systems.\n"
maintainers = [
    { name = "Kai Willadsen", email = "kai.willadsen@gmail.com" },
]
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control",
]
keywords = [
    "diff",
    "merge",
]
version = "3.99.3"

[project.license]
file = "COPYING"

[project.urls]
homepage = "https://meld.app/"
documentation = "https://meld.app/help/"
source = "https://gitlab.gnome.org/GNOME/meld/-/tree/main"
download = "https://gitlab.gnome.org/GNOME/meld/-/releases"
tracker = "https://gitlab.gnome.org/GNOME/meld/-/issues"

[dependency-groups]
dev = [
    "ruff==0.16.*",
    "pre-commit==4.6.*",
    "pytest==9.1.*",
    "pytest-mock==3.15.*",
]

[tool.meson-python.args]
setup = [
    "-Dis_wheel=true",
]

[tool.ruff]
extend-include = [
    "bin/meld",
    "maint",
]

[tool.ruff.lint]
ignore = [
    "BLE001",
    "RUF015",
    "UP031",
    "RUF059",
]
allowed-confusables = [
    "’",
]

[tool.ruff.lint.per-file-ignores]
"test/**" = [
    "RUF059",
]

[tool.ruff.lint.isort]
known-first-party = [
    "meld",
]
no-lines-before = [
    "local-folder",
]
order-by-type = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = [
    "test",
]
