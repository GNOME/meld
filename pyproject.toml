[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python == 0.20.0",
    "meson == 1.12.0",
]

[project]
name = "Meld"
dynamic = ["version"]
license = {file = "COPYING"}
description = """
Meld is a visual diff and merge tool targeted at developers. Meld helps you
compare files, directories, and version controlled projects. It provides
two- and three-way comparison of both files and directories, and supports
many version control systems.
"""

maintainers = [
    {name = "Kai Willadsen", email = "kai.willadsen@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control",
]
keywords=[
    "diff",
    "merge",
]

[project.urls]
homepage = "https://meld.app/"
documentation = "https://meld.app/help/"
source = "https://gitlab.gnome.org/GNOME/meld/-/tree/main"
download = "https://gitlab.gnome.org/GNOME/meld/-/releases"
tracker = "https://gitlab.gnome.org/GNOME/meld/-/issues"

[dependency-groups]
dev = [
    "ruff==0.16.*",
    "pre-commit==4.6.*",
    "pytest==9.1.*",
    "pytest-mock==3.15.*",
]

[tool.meson-python.args]
setup = ['-Dis_wheel=true']

[tool.ruff]
# Extensionless Python scripts, so that a bare `ruff check` covers the same
# files that the pre-commit hook does.
extend-include = ["bin/meld", "maint"]

[tool.ruff.lint]
ignore = [
    # We use broad exception catching when interacting with external systems
    # quite a bit (e.g., version control)
    "BLE001",
    # These are probably interim ignores. They should mostly be fixed at
    # some point.
    "UP031",
    "RUF015",
    "RUF059",
]
allowed-confusables = ["’"]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["RUF059"]

[tool.ruff.lint.isort]
known-first-party = [
    "meld",
]
no-lines-before = [
    "local-folder",
]
order-by-type = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = [
    "test",
]
